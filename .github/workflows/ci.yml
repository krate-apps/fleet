name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Install torrent-helper build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake build-essential libssl-dev
      - name: Vet and test
        run: |
          go mod tidy
          pkgs="$(go list ./... | grep -v /node_modules/)"
          go vet $pkgs
          go test $pkgs
      - name: Cache bench smoke
        run: go test ./internal/sync/ -bench=BenchmarkCacheApply1000 -benchmem -count=1
      - name: Build binaries
        run: |
          make build
          go build -o bin/rtprobe ./cmd/rtprobe

      - name: Install / uninstall / pack smoke
        run: |
          bash tests/scripts/install_uninstall_smoke.sh
          bash tests/scripts/pack_smoke.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and check
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
