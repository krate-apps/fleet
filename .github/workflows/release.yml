name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Next version
        id: ver
        run: |
          set -euo pipefail
          VERSION="$(INITIAL_VERSION=1.0.0 bash scripts/next-version.sh)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Pack
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/pack.sh dist
      - name: Release notes
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Commits since the previous semver tag (exclusive) up to HEAD.
          bash scripts/release-notes.sh > dist/RELEASE_NOTES.md
          echo "----- RELEASE NOTES -----"
          cat dist/RELEASE_NOTES.md
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Fleet ${{ steps.ver.outputs.tag }}
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: false
          files: |
            dist/*.tgz
            dist/SHA256SUMS
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.ver.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
      - name: Notify Official bucket
        env:
          GH_TOKEN: ${{ secrets.FLEET_BUCKET_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "skip dispatch: FLEET_BUCKET_TOKEN unset"
            exit 0
          fi
          jq -n --arg src "$REPO" --arg tag "$TAG" \
            '{event_type:"fleet-release",client_payload:{source:$src,tag:$tag}}' \
            | gh api repos/krate-apps/fleet-official-bucket/dispatches --input -
