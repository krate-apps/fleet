# Fleet on a dedicated VirtualHost (root path).
# Build with default FLEET_UI_BASE=/.
# Requires: a2enmod proxy proxy_http proxy_wstunnel headers ssl

<VirtualHost *:443>
    ServerName fleet.example.com

    # SSLEngine on
    # SSLCertificateFile /path/to/fullchain.pem
    # SSLCertificateKeyFile /path/to/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/api/v1/events/ws$ ws://127.0.0.1:8080/api/v1/events/ws [P,L]
</VirtualHost>
