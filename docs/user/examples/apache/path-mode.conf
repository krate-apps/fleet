# Fleet behind Apache httpd on a path prefix (example: /fleet/).
# Build the UI with: FLEET_UI_BASE=/fleet/ make embed build
# Requires: a2enmod proxy proxy_http proxy_wstunnel rewrite headers

<Location /fleet>
    # Prefer a trailing slash; redirect bare /fleet → /fleet/
</Location>

RewriteEngine On
RewriteRule ^/fleet$ /fleet/ [R=302,L]

# HTTP API + UI (strip /fleet prefix toward upstream)
ProxyPreserveHost On
ProxyRequests Off
RequestHeader set X-Forwarded-Prefix "/fleet"
RequestHeader set X-Forwarded-PathBase "/fleet"
RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

RewriteRule ^/fleet/(.*)$ http://127.0.0.1:8080/$1 [P,L]
ProxyPassReverse /fleet/ http://127.0.0.1:8080/

# WebSocket events (adjust if your Fleet base path differs)
RewriteCond %{HTTP:Upgrade} websocket [NC]
RewriteCond %{HTTP:Connection} upgrade [NC]
RewriteRule ^/fleet/(api/v1/events/ws)$ ws://127.0.0.1:8080/$1 [P,L]
