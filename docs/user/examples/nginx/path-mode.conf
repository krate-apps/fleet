# Fleet behind nginx on a path prefix (example: /fleet/).
# Build the UI with: FLEET_UI_BASE=/fleet/ make embed build
# Place inside an existing server { } block (or include this file).

location = /fleet {
    return 302 /fleet/;
}

location /fleet/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /fleet;
    proxy_set_header X-Forwarded-PathBase /fleet;
    # WebSocket (events)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    rewrite ^/fleet/?(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8080;
}

# Required once in http { } context for WebSocket map:
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
