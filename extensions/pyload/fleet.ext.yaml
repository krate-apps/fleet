schema: 1
id: org.fleet.pyload
name: pyLoad
description: Monitor and control a local pyLoad download queue from Fleet.
version: 0.1.0
api: ">=1.0.0 <2.0.0"
engines:
  - rtorrent
capabilities:
  - storage.read
  - storage.write
frontend:
  type: declarative
  entry: ui/extension.json
backend:
  type: process
  executable: bin/pyload-worker
  protocol: jsonrpc-2
